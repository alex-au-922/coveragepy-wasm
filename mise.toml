[tools]
node = "26.13.1"
python = "3.14.10"
uv = "0.13.9"

[env]
UV_PYTHON = "3.14"

[tasks."docs:build"]
description = "Build the documentation and validate internal links"
run = "uv run --locked --only-group docs mkdocs build --strict"

[tasks.build]
description = "Build and validate the wheel and source distribution"
run = '''
#!/usr/bin/env bash
set -euo pipefail

version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
uv build --no-sources
uv tool run twine check --strict "dist/coverage_wasm-$version-py3-none-any.whl" "dist/coverage_wasm-$version.tar.gz"
'''

[tasks.test]
description = "Test the built wheel end to end and collect package coverage"
run = '''
#!/usr/bin/env bash
set -euo pipefail

version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
wheel="$PWD/dist/coverage_wasm-$version-py3-none-any.whl"
if [[ ! -f $wheel ]]; then
    echo 'Run mise build to build the wheel before mise test.' >&2
    exit 1
fi

session=tests
if (( $# > 1 )); then
    echo 'Usage: mise test [host-python-version]' >&2
    exit 2
fi
if (( $# == 1 )); then
    session="tests-$1"
fi

npm install --prefix examples/pyodide/.pyodide --no-save --no-package-lock pyodide@314.0.8
temp=$(mktemp -d "${TMPDIR:-/tmp}/coverage-wasm.XXXXXX")
trap 'rm -rf -- "$temp"' EXIT
coverage_version=$(python -c 'import tomllib; print(next(p["version"] for p in tomllib.load(open("uv.lock", "rb"))["package"] if p["name"] == "coverage"))')
uv tool run --from pip pip download --only-binary=:all: --platform any --no-deps \
    --dest "$temp" "coverage==$coverage_version"
uv tool run nox==2026.10.20 --error-on-missing-interpreters --parallel 2 \
    -s "$session" -- "$wheel" "$temp/coverage-$coverage_version-py3-none-any.whl"

if (( $# == 0 )); then
    mise run coverage
fi

if (( $# == 1 )) && [[ $1 != 3.14 ]]; then
    exit 0
fi

uv run --locked --group wasm-test ruff format --check src tests noxfile.py
uv run --locked --group wasm-test ruff check src tests noxfile.py
uv run --locked --group wasm-test pyright

# Refresh the local wheel in each example if its contents changed.
(
    cd examples/pyodide
    uv run --no-project --python 3.11 --with "$wheel" \
        --with pytest==8.4.0 --with pytest-pyodide==0.59.4 \
        pytest --cov --cov-report=html
    test -s htmlcov/index.html
    uv run --upgrade-package coverage-wasm pytest --cov --cov-report=html -k free_at_threshold
    uv run pytest --cov --cov-report=html:htmlcov-merged
    test -s htmlcov-merged/index.html
)
(
    cd examples/wasi
    uv run --upgrade-package coverage-wasm pytest --cov --cov-report=html
    test -s output/htmlcov/index.html
)
(
    cd examples/workerd
    uv run --upgrade-package coverage-wasm pytest --cov=src --cov-report=html --cov-fail-under=100
    test -s htmlcov/index.html
)
'''

[tasks.coverage]
description = "Combine host coverage data and require 100% package coverage"
run = '''
#!/usr/bin/env bash
set -euo pipefail

coverage=(uv run --isolated --locked --no-default-groups coverage)
"${coverage[@]}" combine --keep .coverage-matrix
"${coverage[@]}" html --fail-under=100
'''
