site_name: coverage-wasm
site_description: Python line and branch coverage for WebAssembly in pytest
site_url: https://alex-au-922.github.io/coveragepy-wasm/
repo_url: https://github.com/alex-au-922/coveragepy-wasm
repo_name: alex-au-922/coveragepy-wasm
edit_uri: edit/main/docs/

theme:
  name: material
  logo: assets/coverage-wasm-mark-reverse.svg
  favicon: assets/coverage-wasm-mark.svg
  font: false
  features:
    - content.code.copy
    - navigation.sections
    - navigation.instant
    - navigation.footer
    - navigation.top
    - toc.follow
  palette:
    - media: "(prefers-color-scheme)"
      primary: deep purple
      accent: deep purple
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: deep purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: deep purple
      toggle:
        icon: material/brightness-4
        name: Switch to system preference

plugins:
  - search

extra_css:
  - assets/site.css

markdown_extensions:
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences
  - toc:
      permalink: true

nav:
  - Quickstart: index.md
  - Runtimes:
      - Pyodide: pyodide.md
      - Workerd: workerd.md
      - CPython on WASI: wasi.md
  - Coverage configuration: configuration.md
  - Custom launchers: custom-launchers.md

validation:
  links:
    anchors: warn
