name: Package tests and coverage

on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: mise install
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          version: "2026.9.1"
          install: true
          cache: false
      - run: mise build

      - name: Keep the built distributions
        uses: actions/upload-artifact@v7
        with:
          name: coverage-wasm-distributions
          if-no-files-found: error
          path: |
            dist/*.whl
            dist/*.tar.gz

  test:
    name: Package tests (Python ${{ matrix.python }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14', '3.15']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: mise install
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          version: "2026.9.1"
          install: true
          cache: false
      - name: Download the built distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-wasm-distributions
          path: dist
      - run: mise test ${{ matrix.python }}

      - name: Keep host coverage data
        uses: actions/upload-artifact@v7
        with:
          name: coverage-data-${{ matrix.python }}
          path: .coverage-matrix/.coverage.${{ matrix.python }}
          include-hidden-files: true
          if-no-files-found: error

      - name: Keep example coverage reports
        if: matrix.python == '3.14'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-wasm-example-reports
          if-no-files-found: error
          path: |
            examples/pyodide/htmlcov/
            examples/pyodide/htmlcov-merged/
            examples/wasi/output/htmlcov/
            examples/workerd/htmlcov/

  coverage:
    name: Combined package coverage
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: mise install
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          version: "2026.9.1"
          install: true
          cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-data-*
          path: .coverage-matrix
          merge-multiple: true
      - run: mise run coverage
      - name: Keep the package coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-wasm-reports
          path: htmlcov/
          if-no-files-found: error
