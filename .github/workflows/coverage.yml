name: 100% E2E coverage gate

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: mise install
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          version: "2026.9.1"
          install: true
          cache: false
      - run: mise build
      - run: mise test

      - name: Keep the tested distributions
        uses: actions/upload-artifact@v7
        with:
          name: coverage-wasm-distributions
          if-no-files-found: error
          path: |
            dist/*.whl
            dist/*.tar.gz

      - name: Keep package and example coverage reports
        if: ${{ !cancelled() && hashFiles('htmlcov/index.html') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-wasm-reports
          if-no-files-found: error
          path: |
            htmlcov/
            examples/pyodide/htmlcov/
            examples/pyodide/htmlcov-merged/
            examples/wasi/output/htmlcov/
            examples/workerd/htmlcov/
