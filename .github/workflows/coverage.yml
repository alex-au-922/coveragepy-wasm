name: 100% E2E coverage gate

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: mise install
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          version: "2026.9.1"
          install: true
          cache: false
      - run: mise build

      - name: Keep the built distributions
        uses: actions/upload-artifact@v7
        with:
          name: coverage-wasm-distributions
          if-no-files-found: error
          path: |
            dist/*.whl
            dist/*.tar.gz

  test:
    name: Wasm E2E (Python ${{ matrix.python }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14', '3.15']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: mise install
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          version: "2026.9.1"
          install: true
          cache: false
      - name: Download the built distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-wasm-distributions
          path: dist
      - run: mise test ${{ matrix.python }}

      - name: Keep package and example coverage reports
        if: ${{ !cancelled() && matrix.python == '3.14' && hashFiles('htmlcov/index.html') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-wasm-reports
          if-no-files-found: error
          path: |
            htmlcov/
            examples/pyodide/htmlcov/
            examples/pyodide/htmlcov-merged/
            examples/wasi/output/htmlcov/
            examples/workerd/htmlcov/
