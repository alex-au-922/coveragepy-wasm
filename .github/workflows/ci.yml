name: CI

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.4"
          python-version: "3.14"
      - uses: actions/setup-node@v7
        with:
          node-version: "24.18.0"
          package-manager-cache: false

      - name: Check the release tag
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          uv run --locked --no-default-groups python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          from packaging.version import Version

          version = Version(tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"])
          if os.environ["RELEASE_TAG"] != f"v{version}":
              raise SystemExit(f"The release tag must be v{version}")
          if version.is_prerelease != (os.environ["RELEASE_PRERELEASE"] == "true"):
              raise SystemExit("The GitHub prerelease flag must match the package version")
          PY

      - name: Build and check distributions
        run: |
          uv build --no-sources
          uvx twine check --strict dist/*.whl dist/*.tar.gz

      - name: Test the wheel on supported host Python versions
        run: uvx nox==2026.10.20 --error-on-missing-interpreters -s tests -- dist/*.whl

      - name: Install Pyodide
        working-directory: examples/pyodide
        run: npm install --prefix .pyodide --no-save --no-package-lock pyodide@314.0.8

      - name: Check source and run the runtime test suite
        run: |
          uv run --locked --group wasm-test ruff format --check src tests noxfile.py
          uv run --locked --group wasm-test ruff check src tests noxfile.py
          uv run --locked --group wasm-test pyright
          coverage_version=$(uv run --locked --group wasm-test python -c 'import coverage; print(coverage.__version__)')
          uvx --from pip pip download --only-binary=:all: --platform any --no-deps \
            --dest "$RUNNER_TEMP" "coverage==$coverage_version"
          WASM_COVERAGE_PURE_WHEEL="$RUNNER_TEMP/coverage-$coverage_version-py3-none-any.whl" \
            uv run --locked --group wasm-test coverage run --data-file=.coverage-package \
              --branch --source=coverage_wasm -m pytest --runtime=node \
              --dist-dir=examples/pyodide/.pyodide/node_modules/pyodide
          uv run --locked --group wasm-test coverage report --data-file=.coverage-package -m
          uv run --locked --group wasm-test coverage html --data-file=.coverage-package

      - name: Test the minimum Python and pytest with the wheel
        working-directory: examples/pyodide
        run: |
          uv run --no-project --python 3.11 --with ../../dist/coverage_wasm-*.whl \
            --with pytest==8.4.0 --with pytest-pyodide==0.59.4 \
            pytest --cov --cov-report=html
          test -s htmlcov/index.html

      - name: Test the Pyodide example with the wheel
        working-directory: examples/pyodide
        run: |
          uv run pytest --cov --cov-report=html -k free_at_threshold
          uv run pytest --cov --cov-report=html:htmlcov-merged
          test -s htmlcov-merged/index.html

      - name: Test the WASI example with the wheel
        working-directory: examples/wasi
        run: |
          uv run pytest --cov --cov-report=html
          test -s output/htmlcov/index.html

      - name: Test the Workerd example with the wheel
        working-directory: examples/workerd
        run: |
          uv run pytest --cov=src --cov-report=html --cov-fail-under=100
          test -s htmlcov/index.html

      - name: Keep the tested distributions
        uses: actions/upload-artifact@v7
        with:
          name: coverage-wasm-distributions
          if-no-files-found: error
          path: |
            dist/*.whl
            dist/*.tar.gz

      - name: Keep package and example coverage reports
        uses: actions/upload-artifact@v7
        with:
          name: coverage-wasm-reports
          if-no-files-found: error
          path: |
            htmlcov/
            examples/pyodide/htmlcov/
            examples/pyodide/htmlcov-merged/
            examples/wasi/output/htmlcov/
            examples/workerd/htmlcov/
