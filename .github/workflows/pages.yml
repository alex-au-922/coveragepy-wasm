name: Documentation

on:
  pull_request:
    paths:
      - 'docs/**'
      - 'zensical.toml'
      - '.github/workflows/pages.yml'
      - 'mise.toml'
      - 'pyproject.toml'
      - 'uv.lock'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  queue: max

jobs:
  package:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/coverage.yml

  build:
    name: Build documentation
    needs: package
    if: ${{ !cancelled() && (github.ref != 'refs/heads/main' || needs.package.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: mise install
        uses: jdx/mise-action@v5
        with:
          install: true
          cache: false
      - run: mise build-doc
      - uses: actions/upload-pages-artifact@v4
        if: github.ref == 'refs/heads/main'
        with:
          path: site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
