[project]
name = "coverage-wasm-workerd-example"
version = "0.1.0"
requires-python = ">=3.14"

[dependency-groups]
dev = [
    "coverage-wasm==0.2.0rc1",
    "httpx>=0.28,<0.29",
    "pytest>=9,<10",
    "workers-py==1.17.9",
    "workers-runtime-sdk==1.9.6",
]

[tool.uv.sources]
coverage-wasm = { path = "../../dist/coverage_wasm-0.2.0rc1-py3-none-any.whl" }

[tool.pytest.ini_options]
testpaths = ["test_worker.py"]

[tool.coverage.run]
branch = true
source = ["src"]
omit = ["*/python_modules/**"]

[tool.coverage.paths]
source = ["src", "/session/metadata"]

[tool.coverage.html]
show_contexts = true

[tool.pyright]
include = ["src", "conftest.py", "test_worker.py"]
typeCheckingMode = "strict"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
