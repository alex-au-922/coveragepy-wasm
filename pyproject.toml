[project]
name = "coverage-wasm"
version = "0.2.0"
description = "A Coverage.py addon for Python line and branch coverage in WebAssembly"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "coverage==7.17.3",
    "pytest>=8.4",
    "pytest-cov==7.1.0",
]
keywords = ["coverage", "coverage.py", "pytest", "webassembly", "pyodide"]
classifiers = ["Development Status :: 3 - Alpha", "Framework :: Pytest"]

[project.entry-points.pytest11]
coverage-wasm = "coverage_wasm.pytest_plugin"

[dependency-groups]
dev = [
    "pyright>=1.1.395",
    "pytest>=9",
    "ruff>=0.11",
]
wasm-test = [
    "pytest-pyodide==0.59.4",
    "pytest-xdist>=3.8",
    "testcontainers==4.15.0",
    "wasi-python==0.1.5",
    "workers-py==1.17.9",
    "workers-runtime-sdk==1.9.6",
]

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
source-include = [
    "CHANGELOG.md",
    "noxfile.py",
    "examples/README.md",
    "examples/*/README.md",
    "examples/*/pyproject.toml",
    "examples/pyodide/*.py",
    "examples/wasi/src/*.py",
    "examples/wasi/tests/*.py",
    "examples/workerd/*.py",
    "examples/workerd/src/*.py",
    "examples/workerd/package.json",
    "examples/workerd/package-lock.json",
    "examples/workerd/wrangler.toml",
]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "strict"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
relative_files = true

[tool.coverage.paths]
package = ["src/coverage_wasm", "*/site-packages/coverage_wasm"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
